apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ztp-policies
  namespace: openshift-gitops
spec:
  project: default

  source:
    repoURL: <GIT_REPO_URL>  # set by scripts/bootstrap-ztp.sh, or replace manually
    targetRevision: main
    path: policies

  destination:
    server: https://kubernetes.default.svc
    namespace: open-cluster-management-policies

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
