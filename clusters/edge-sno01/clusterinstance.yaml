apiVersion: siteconfig.open-cluster-management.io/v1alpha1
kind: ClusterInstance

metadata:
  name: edge-sno01
  namespace: edge-sno01

spec:
  clusterName: edge-sno01

  baseDomain: ocp.local

  pullSecretRef:
    name: assisted-deployment-pull-secret

  clusterImageSetNameRef: img4.22.11-x86-64-appsub

  templateRefs:
    - name: ai-cluster-templates-v1
      namespace: open-cluster-management

  sshPublicKey: "ssh-rsa  root@hvm1"

  clusterType: SNO

  networkType: OVNKubernetes

  machineNetwork:
    - cidr: 20.20.20.0/24

  clusterNetwork:
    - cidr: 10.128.0.0/14
      hostPrefix: 23

  serviceNetwork:
    - cidr: 172.30.0.0/16

  nodes:
    - hostName: edge-sno01.ocp.local

      role: master

      templateRefs:
        - name: ai-node-templates-v1
          namespace: open-cluster-management

      bmcAddress: "redfish-virtualmedia+https://172.28.0.13/redfish/v1/Systems/1"

      bmcCredentialsName:
        name: edge-sno01-bmc-secret

      bootMACAddress: "8c:84:74:0d:be:90"

      bootMode: UEFI

      nodeNetwork:
        interfaces:
          - name: eno1
            macAddress: "8c:84:74:0d:be:90"

        config:
          interfaces:
            - name: eno1
              type: ethernet
              state: up

              ipv4:
                enabled: true
                dhcp: false
                address:
                  - ip: 20.20.20.42
                    prefix-length: 24

              ipv6:
                enabled: false

        routes:
          config:
            - destination: 0.0.0.0/0
              next-hop-address: 20.20.20.2
              next-hop-interface: eno1

        dns-resolver:
          config:
            server:
              - 20.20.20.2
